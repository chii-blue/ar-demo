<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>謎解きAR検証デモ - 家紋風マーカー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .ui-overlay {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 999;
      font-family: sans-serif;
      color: #fff;
      background: rgba(0,0,0,0.55);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <div class="ui-overlay">
    手がかりを見つけたら、カメラを向けてみよう。
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">

    <a-assets>
      <canvas id="messageCanvas" width="1024" height="256"></canvas>
    </a-assets>
    <script>
      (function () {
        var canvas = document.getElementById('messageCanvas');
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 100px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('鏡に映る数字を数えよ', canvas.width / 2, canvas.height / 2);
      })();
    </script>

    <!-- ==============================================
         家紋風マーカー（案2）を使用中
         印刷用マーカー画像の作り方はREADME参照
         ============================================== -->
    <a-marker type="pattern" url="markers/pattern-kamon-marker-inner.patt">

      <!-- 幽霊（家紋風マーカーの案2デザインに寄せた簡易モデル）
           本体はローカルY軸方向に伸びた形状（縦長）、目はローカルZ軸方向（正面）を向く配置。
           テキスト板と同じ理由で、そのままだと垂直マウント時に本体の伸びる向きが
           カメラ側（頭がこちら向き）になってしまうため、rotation="-90 0 0" で
           本体の伸びる向きをマーカーの-Z軸（垂直マウント時の「壁の上方向」）に、
           目の正面をマーカーのY軸（常にカメラ側）に向け直している。 -->
      <a-entity position="0 0.5 0" rotation="-90 0 0">
        <a-sphere radius="0.35" scale="1 1.286 0.857" color="#f5f2e8" opacity="0.85" material="transparent: true; shader: flat"></a-sphere>
        <a-sphere position="-0.12 0.05 0.28" radius="0.05" color="#2b2b28"></a-sphere>
        <a-sphere position="0.12 0.05 0.28" radius="0.05" color="#2b2b28"></a-sphere>
      </a-entity>

      <!-- 謎のメッセージ（Canvasに描画した日本語テキストをテクスチャとして使用）
           マーカーは壁に垂直（縦向き）に貼る前提。
           a-markerのローカル座標系はY軸がマーカー面の法線（常にカメラ側を向く軸）、
           X/Zはマーカー面内の軸。デフォルトのa-planeはZ軸方向を向いているため、
           そのままだと平面がマーカー面と同じ向きになり、縦置き時に真横（帯状）に見えてしまう。
           rotation="-90 0 0" でa-planeの法線をY軸（＝常にカメラ側）に向け直し、
           垂直マウント時にテキストが正面かつ正立して見えるようにしている。 -->
      <a-plane position="0 0.5 -1.1" rotation="-90 0 0" width="2" height="0.5"
               material="src: #messageCanvas; shader: flat">
      </a-plane>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
