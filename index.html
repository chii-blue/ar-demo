<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>謎解きAR検証デモ - 家紋風マーカー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol&family=Yomogi&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; overflow: hidden; }
    .ui-overlay {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 999;
      font-family: sans-serif;
      color: #fff;
      background: rgba(0,0,0,0.55);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    /* 古びた日記のページめくり演出 */
    .diary-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    .diary-overlay.is-visible {
      display: flex;
    }
    .diary-perspective {
      perspective: 1600px;
    }
    .diary-book {
      position: relative;
      width: min(80vw, 56.6vh);
      max-width: 420px;
      aspect-ratio: 1000 / 1414;
      transform-style: preserve-3d;
    }
    .diary-overlay.is-visible .diary-book {
      animation: diary-materialize 2s ease-out;
    }
    @keyframes diary-materialize {
      0%   { filter: blur(20px); transform: scale(0.9); }
      55%  { filter: blur(6px);  transform: scale(0.9); }
      75%  { filter: blur(1.5px); transform: scale(1.05); }
      90%  { filter: blur(0px);  transform: scale(0.97); }
      100% { filter: blur(0px);  transform: scale(1); }
    }
    .diary-page {
      position: absolute;
      inset: 0;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14% 12%;
      background-image: url('images/diary-page.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      transform-origin: left center;
      backface-visibility: hidden;
    }
    .diary-page-base {
      z-index: 1;
    }
    .diary-page-flip {
      z-index: 2;
      transform-style: preserve-3d;
      cursor: pointer;
    }
    .diary-page-flip.is-flipped {
      animation: diary-page-flip 1.6s ease-in-out forwards;
    }
    /* めくれる側の角が浮き上がってカールするようなハイライト */
    .diary-page-flip::before,
    .diary-page-flip::after {
      content: '';
      position: absolute;
      width: 28%;
      height: 28%;
      opacity: 0;
      pointer-events: none;
    }
    .diary-page-flip::before {
      top: 0;
      right: 0;
      clip-path: polygon(100% 0, 100% 100%, 0 0);
      background: radial-gradient(circle at 100% 0%, rgba(255,255,255,0.7), rgba(120,90,50,0.2) 55%, transparent 72%);
    }
    .diary-page-flip::after {
      bottom: 0;
      right: 0;
      clip-path: polygon(100% 100%, 0 100%, 100% 0);
      background: radial-gradient(circle at 100% 100%, rgba(255,255,255,0.7), rgba(120,90,50,0.2) 55%, transparent 72%);
    }
    .diary-page-flip.is-flipped::before,
    .diary-page-flip.is-flipped::after {
      animation: diary-corner-curl 1.6s ease-in-out forwards;
    }
    @keyframes diary-page-flip {
      0%   { transform: rotateY(0deg); }
      45%  { transform: rotateY(-95deg) scale(0.96); }
      100% { transform: rotateY(-180deg); }
    }
    @keyframes diary-corner-curl {
      0%   { opacity: 0; transform: scale(0.5) rotate(0deg); }
      45%  { opacity: 1; transform: scale(1.08) rotate(-12deg); }
      75%  { opacity: 0.5; transform: scale(1) rotate(-6deg); }
      100% { opacity: 0; transform: scale(0.7) rotate(0deg); }
    }
    .diary-text {
      font-family: 'Kaisei Decol', serif;
      color: #4a3826;
      font-size: clamp(14px, 4vw, 20px);
      line-height: 1.9;
      text-align: center;
      white-space: pre-wrap;
    }
    .diary-tap-hint {
      font-family: sans-serif;
      color: #fff;
      font-size: 14px;
      letter-spacing: 0.05em;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
      opacity: 0;
      visibility: hidden;
    }
    .diary-tap-hint.is-visible {
      visibility: visible;
      animation: diary-tap-blink 1.2s ease-in-out infinite;
    }
    @keyframes diary-tap-blink {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <div class="ui-overlay">
    手がかりを見つけたら、カメラを向けてみよう。
  </div>

  <!-- 古びた日記のページめくり演出（マーカー認識時にHTML要素として重ねて表示） -->
  <div id="diary-overlay" class="diary-overlay">
    <div class="diary-perspective">
      <div class="diary-book">
        <div class="diary-page diary-page-base">
          <div class="diary-text" id="diary-text-next"></div>
        </div>
        <div class="diary-page diary-page-flip" id="diary-page-flip">
          <div class="diary-text" id="diary-text-current"></div>
        </div>
      </div>
    </div>
    <div class="diary-tap-hint" id="diary-tap-hint">画面をタップ</div>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">

    <!-- ==============================================
         家紋風マーカー（案2）を使用中
         印刷用マーカー画像の作り方はREADME参照
         ============================================== -->
    <a-marker type="pattern" url="markers/pattern-kamon-marker-inner.patt">
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    (function () {
      var overlay = document.getElementById('diary-overlay');
      var flipPage = document.getElementById('diary-page-flip');
      var textCurrent = document.getElementById('diary-text-current');
      var textNext = document.getElementById('diary-text-next');
      var tapHint = document.getElementById('diary-tap-hint');
      var pages = [
        '1977年、\n私はある贈り物を探していた……',
        '大切な方への贈り物だったのに……'
      ];
      var tapHintTimer = null;
      var flipped = false;

      function showDiary() {
        clearTimeout(tapHintTimer);
        flipped = false;
        flipPage.classList.remove('is-flipped');
        tapHint.classList.remove('is-visible');
        textCurrent.textContent = pages[0];
        textNext.textContent = pages[1];
        overlay.classList.add('is-visible');
        tapHintTimer = setTimeout(function () {
          tapHint.classList.add('is-visible');
        }, 2000);
      }

      function hideDiary() {
        overlay.classList.remove('is-visible');
        tapHint.classList.remove('is-visible');
        clearTimeout(tapHintTimer);
      }

      function doFlip() {
        if (flipped) return;
        flipped = true;
        clearTimeout(tapHintTimer);
        tapHint.classList.remove('is-visible');
        flipPage.classList.add('is-flipped');
      }

      overlay.addEventListener('click', doFlip);

      var markerEl = document.querySelector('a-marker');
      markerEl.addEventListener('markerFound', showDiary);
      markerEl.addEventListener('markerLost', hideDiary);
    })();
  </script>

</body>
</html>
