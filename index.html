<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>謎解きAR検証デモ - 家紋風マーカー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol&family=Yomogi&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; overflow: hidden; }
    .ui-overlay {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 999;
      font-family: sans-serif;
      color: #fff;
      background: rgba(0,0,0,0.55);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    /* 古びた日記のページめくり演出 */
    .diary-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .diary-overlay.is-visible {
      display: flex;
    }
    .diary-perspective {
      perspective: 1600px;
    }
    .diary-book {
      position: relative;
      width: 80vw;
      max-width: 640px;
      aspect-ratio: 4 / 3;
      max-height: 80vh;
      transform-style: preserve-3d;
    }
    .diary-page {
      position: absolute;
      inset: 0;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16% 15%;
      background-image: url('images/diary-page.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      transform-origin: left center;
      backface-visibility: hidden;
    }
    .diary-page-base {
      z-index: 1;
    }
    .diary-page-flip {
      z-index: 2;
      transition: transform 0.6s ease-in-out;
      cursor: pointer;
    }
    .diary-page-flip.is-flipped {
      transform: rotateY(-180deg);
    }
    .diary-text {
      font-family: 'Kaisei Decol', serif;
      color: #4a3826;
      font-size: clamp(14px, 4vw, 20px);
      line-height: 1.9;
      text-align: center;
      white-space: pre-wrap;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <div class="ui-overlay">
    手がかりを見つけたら、カメラを向けてみよう。
  </div>

  <!-- 古びた日記のページめくり演出（マーカー認識時にHTML要素として重ねて表示） -->
  <div id="diary-overlay" class="diary-overlay">
    <div class="diary-perspective">
      <div class="diary-book">
        <div class="diary-page diary-page-base">
          <div class="diary-text" id="diary-text-next"></div>
        </div>
        <div class="diary-page diary-page-flip" id="diary-page-flip">
          <div class="diary-text" id="diary-text-current"></div>
        </div>
      </div>
    </div>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">

    <a-assets>
      <canvas id="messageCanvas" width="1024" height="256"></canvas>
    </a-assets>
    <script>
      (function () {
        var canvas = document.getElementById('messageCanvas');
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 100px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('鏡に映る数字を数えよ', canvas.width / 2, canvas.height / 2);
      })();
    </script>

    <!-- ==============================================
         家紋風マーカー（案2）を使用中
         印刷用マーカー画像の作り方はREADME参照
         ============================================== -->
    <a-marker type="pattern" url="markers/pattern-kamon-marker-inner.patt">

      <!-- 謎のメッセージ（Canvasに描画した日本語テキストをテクスチャとして使用）
           マーカーは壁に垂直（縦向き）に貼る前提。
           a-markerのローカル座標系はY軸がマーカー面の法線（常にカメラ側を向く軸）、
           X/Zはマーカー面内の軸。デフォルトのa-planeはZ軸方向を向いているため、
           そのままだと平面がマーカー面と同じ向きになり、縦置き時に真横（帯状）に見えてしまう。
           rotation="-90 0 0" でa-planeの法線をY軸（＝常にカメラ側）に向け直し、
           垂直マウント時にテキストが正面かつ正立して見えるようにしている。 -->
      <a-plane position="0 0.5 -1.1" rotation="-90 0 0" width="2" height="0.5"
               material="src: #messageCanvas; shader: flat">
      </a-plane>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    (function () {
      var overlay = document.getElementById('diary-overlay');
      var flipPage = document.getElementById('diary-page-flip');
      var textCurrent = document.getElementById('diary-text-current');
      var textNext = document.getElementById('diary-text-next');
      var pages = [
        '1977年、私はある贈り物を探していた……',
        '日記ページ2'
      ];
      var flipTimer = null;
      var flipped = false;

      function showDiary() {
        clearTimeout(flipTimer);
        flipped = false;
        flipPage.classList.remove('is-flipped');
        textCurrent.textContent = pages[0];
        textNext.textContent = pages[1];
        overlay.classList.add('is-visible');
        flipTimer = setTimeout(doFlip, 3000);
      }

      function hideDiary() {
        overlay.classList.remove('is-visible');
        clearTimeout(flipTimer);
      }

      function doFlip() {
        if (flipped) return;
        flipped = true;
        clearTimeout(flipTimer);
        flipPage.classList.add('is-flipped');
      }

      overlay.addEventListener('click', doFlip);

      var markerEl = document.querySelector('a-marker');
      markerEl.addEventListener('markerFound', showDiary);
      markerEl.addEventListener('markerLost', hideDiary);
    })();
  </script>

</body>
</html>
