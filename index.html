<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>謎解きAR検証デモ - 家紋風マーカー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .ui-overlay {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 999;
      font-family: sans-serif;
      color: #fff;
      background: rgba(0,0,0,0.55);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <div class="ui-overlay">
    紙に印刷したマーカー（Hiroマーカー）にカメラをかざしてください。<br>
    幽霊と謎のメッセージが浮かび上がります。
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">

    <!-- ==============================================
         検証用: まずは AR.js 標準の「Hiroマーカー」で動作確認
         Hiroマーカー画像は下記からダウンロード・印刷してください:
         https://github.com/AR-js-org/AR.js/blob/master/data/images/hiro.png

         案2（家紋風）を使う場合は、下の <a-marker> の
         type="pattern" preset="hiro" の部分を
         type="pattern" url="markers/kamon-pattern.patt"
         に差し替えてください（作り方はREADME参照）
         ============================================== -->
    <a-marker preset="hiro">

      <!-- 幽霊（家紋風マーカーの案2デザインに寄せた簡易モデル） -->
      <a-entity position="0 0.5 0">
        <a-sphere radius="0.35" scale="1 1.286 0.857" color="#f5f2e8" opacity="0.85" material="transparent: true; shader: flat"></a-sphere>
        <a-sphere position="-0.12 0.05 0.28" radius="0.05" color="#2b2b28"></a-sphere>
        <a-sphere position="0.12 0.05 0.28" radius="0.05" color="#2b2b28"></a-sphere>
      </a-entity>

      <!-- 謎のメッセージ -->
      <a-text value="鏡に映る数字を数えよ" align="center" position="0 1.2 0"
              color="#fff" width="2.4"
              geometry="primitive: plane; height: 0.4; width: 2"
              material="color: #000; opacity: 0.6; shader: flat">
      </a-text>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
